<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1d0b4a" />
<meta name="apple-mobile-web-app-title" content="מאורת הדרקון" />
<title>מאורת הדרקון — העולם של אלה</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="stylesheet" href="shared/theme.css" />
<style>
  /* =====================================================================
     dragon.html — מאורת הדרקון: הדרקון שלי · משימות דרקון (אנגלית + חשבון) · משחקים עם הדרקון
     פרק א — מסגרת ורקע קומיקס, פרק ב — לשוניות, פרק ג — חדר הדרקון ומסלול 12 השלבים,
     פרק ד — מפת המשימות, פרק ה — נגן השאלות והסבר, פרק ו — טקס גדילה ומתנה, פרק ז — משחקים
     ===================================================================== */
  /* --- פרק א: רקע --- */
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--h-font); color: var(--h-ink); background: var(--h-night);
    background-image: radial-gradient(rgba(255,255,255,.07) 1.4px, transparent 1.6px), radial-gradient(60% 50% at 80% 0%, rgba(255,46,147,.45), transparent 70%), linear-gradient(170deg, #1d0b4a, #3a1177 60%, #5a1b8a);
    background-size: 16px 16px, auto, auto; overflow: hidden; }
  .wrap { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr; padding: calc(env(safe-area-inset-top) + 12px) 18px 14px 96px; gap: 10px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top h1 { margin: 0; font: 900 clamp(26px, 3.4vw, 42px)/1 var(--h-font); color: #fff; -webkit-text-stroke: 3px var(--h-ink); paint-order: stroke fill; text-shadow: 4px 5px 0 var(--h-ink); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 4px solid var(--h-ink); border-radius: 999px; background: #fffaf0; font: 900 clamp(16px, 1.8vw, 22px)/1 var(--h-font); box-shadow: 0 4px 0 var(--h-ink); }
  .top .sp { flex: 1; }
  /* --- פרק ב: לשוניות --- */
  .tabs { display: flex; gap: 10px; }
  .tab { flex: 1; padding: 12px 10px; border: 4px solid var(--h-ink); border-radius: 20px; background: #fffaf0; font: 900 clamp(16px, 2vw, 24px)/1 var(--h-font); color: var(--h-ink); box-shadow: 0 5px 0 var(--h-ink); cursor: pointer; }
  .tab.on { background: linear-gradient(180deg, #ffd95a, #ff9f1c); transform: translateY(2px); box-shadow: 0 3px 0 var(--h-ink); }
  .pane { display: none; min-height: 0; overflow: auto; border: 4px solid var(--h-ink); border-radius: 28px; background: #fffaf0; box-shadow: 7px 8px 0 var(--h-ink); padding: 16px; }
  .pane.on { display: block; }
  /* --- פרק ג: חדר הדרקון --- */
  .lair { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; height: 100%; min-height: 360px; }
  .scene { position: relative; border: 4px solid var(--h-ink); border-radius: 24px; overflow: hidden; min-height: 340px;
    background: radial-gradient(circle at 50% 70%, rgba(255,217,90,.55), transparent 55%), repeating-conic-gradient(from 0deg at 50% 70%, #ffb347 0 7deg, #ff9f1c 7deg 14deg); }
  .scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(180deg, #6cc85a, #3f9a3a); border-top: 4px solid var(--h-ink); }
  .scene .dragon { position: absolute; left: 50%; bottom: 8%; width: min(70%, 380px); transform: translateX(-50%); z-index: 2; cursor: pointer; filter: drop-shadow(0 10px 0 rgba(16,30,54,.25)); transition: width .8s var(--h-spring); }
  .scene .dragon svg { width: 100%; height: auto; display: block; }
  .scene .dragon.bob { animation: dg-bob 2.4s ease-in-out infinite alternate; }
  .scene .dragon.jump { animation: dg-jump .7s var(--h-spring); }
  @keyframes dg-bob { to { transform: translateX(-50%) translateY(-10px); } }
  @keyframes dg-jump { 40% { transform: translateX(-50%) translateY(-60px) scale(1.06); } }
  .info { display: grid; gap: 12px; align-content: start; }
  .dname { font: 900 clamp(28px, 3.4vw, 42px)/1 var(--h-font); }
  .dstage { font-weight: 800; color: var(--h-text-soft); font-size: clamp(15px, 1.7vw, 20px); }
  .meter { height: 26px; border: 4px solid var(--h-ink); border-radius: 999px; background: #fff; overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #3ff2b0, #ffd95a, #ff9f1c); border-radius: 999px; transition: width .8s var(--h-spring); }
  .path { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .path .st { position: relative; aspect-ratio: 1; border: 3px solid var(--h-ink); border-radius: 16px; background: #fff; display: grid; place-items: center; padding: 3px; }
  .path .st svg { width: 100%; height: auto; }
  .path .st.lock { background: #e3e6ef; } .path .st.lock svg { filter: grayscale(1) brightness(.4) opacity(.5); }
  .path .st.cur { background: #fff3b0; box-shadow: 0 0 0 4px #ffc93c; animation: ch-p 1.4s ease-in-out infinite; }
  .path .st b { position: absolute; bottom: -2px; right: 2px; font-size: 12px; }
  @keyframes ch-p { 50% { transform: scale(1.08); } }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; } .acts .h-btn { flex: 1; min-width: 150px; }
  /* --- פרק ד: מפת המשימות --- */
  .track { margin-bottom: 18px; border: 4px solid var(--h-ink); border-radius: 24px; overflow: hidden; }
  .track h2 { margin: 0; padding: 10px 16px; font: 900 clamp(20px, 2.4vw, 28px)/1.1 var(--h-font); border-bottom: 4px solid var(--h-ink);
    background: radial-gradient(rgba(255,255,255,.35) 1.6px, transparent 1.8px) 0 0/12px 12px, var(--tc); }
  .track h2 small { font-size: .6em; font-weight: 800; }
  .nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 14px; background: color-mix(in srgb, var(--tc) 10%, #fffaf0); }
  .node { position: relative; border: 4px solid var(--h-ink); border-radius: 22px; background: #fff; padding: 12px 8px 10px; text-align: center; font-family: var(--h-font); color: var(--h-ink); box-shadow: 0 5px 0 var(--h-ink); cursor: pointer; }
  .node .ic { font-size: 46px; line-height: 1.1; } .node b { display: block; font-size: 19px; font-weight: 900; }
  .node .stars { font-size: 18px; letter-spacing: 2px; color: #c9ced9; } .node .stars .on { color: #ffbd24; }
  .node small { display: block; font-weight: 800; color: var(--h-text-soft); font-size: 13px; }
  .node.next { background: linear-gradient(180deg, #fff, #fff3b0); animation: ch-p 1.5s ease-in-out infinite; }
  .node.lock { background: #e3e6ef; color: #8a93a8; cursor: default; box-shadow: 0 3px 0 #8a93a8; border-color: #8a93a8; }
  .node.lock .ic { filter: grayscale(1); opacity: .5; }
  .node .num { position: absolute; top: -12px; right: -8px; width: 32px; height: 32px; border: 3px solid var(--h-ink); border-radius: 50%; background: var(--tc); font: 900 16px/26px var(--h-font); }
  /* --- פרק ה: נגן השאלות --- */
  .ov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px; background: rgba(8,14,34,.72); }
  .play { position: relative; width: min(1100px, 100%); height: min(760px, 100%); display: grid; grid-template-rows: auto 1fr auto; gap: 10px; border: 5px solid var(--h-ink); border-radius: 30px; background: #fffaf0; box-shadow: 8px 10px 0 var(--h-ink); padding: 14px 18px; overflow: hidden;
    background-image: radial-gradient(rgba(255,159,28,.13) 2px, transparent 2.4px); background-size: 20px 20px; }
  .ph { display: flex; align-items: center; gap: 12px; }
  .ph .x { width: 54px; height: 54px; border: 4px solid var(--h-ink); border-radius: 50%; background: var(--h-magenta); color: #fff; font: 900 22px/1 var(--h-font); box-shadow: 0 4px 0 var(--h-ink); cursor: pointer; }
  .ph h3 { margin: 0; flex: 1; font: 900 clamp(20px, 2.4vw, 28px)/1 var(--h-font); }
  .pips { display: flex; gap: 6px; } .pips i { width: 22px; height: 22px; border: 3px solid var(--h-ink); border-radius: 50%; background: #fff; }
  .pips i.ok { background: #3ff2b0; } .pips i.no { background: #ffb3b3; } .pips i.cur { background: #ffd95a; transform: scale(1.2); }
  .qbox { display: grid; grid-template-rows: auto auto 1fr; gap: 12px; min-height: 0; text-align: center; }
  .qins { font: 900 clamp(22px, 2.8vw, 34px)/1.2 var(--h-font); }
  .qmain { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .bigpic { display: grid; place-items: center; width: clamp(150px, 22vh, 210px); aspect-ratio: 1; border: 5px solid var(--h-ink); border-radius: 30px; background: #fff; font-size: clamp(90px, 14vh, 130px); box-shadow: 0 6px 0 var(--h-ink); }
  .bigword { direction: ltr; font: 900 clamp(48px, 8vh, 84px)/1 'Rubik', 'Varela Round', sans-serif; letter-spacing: 3px; padding: 10px 24px; border: 5px solid var(--h-ink); border-radius: 24px; background: #fff; box-shadow: 0 6px 0 var(--h-ink); }
  .bigword .gap { display: inline-block; min-width: .8em; border-bottom: 6px solid var(--h-magenta); color: var(--h-magenta); }
  .spk { width: clamp(70px, 10vh, 96px); height: clamp(70px, 10vh, 96px); border: 5px solid var(--h-ink); border-radius: 50%; background: linear-gradient(180deg, #7fe3ff, #29c5ff); font-size: clamp(34px, 5vh, 46px); box-shadow: 0 6px 0 var(--h-ink); cursor: pointer; }
  .spk.slow { background: linear-gradient(180deg, #bff5d9, #3ff2b0); }
  .spk.pulse { animation: ch-p .9s ease-in-out infinite; }
  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(10px, 1.4vw, 16px); align-content: center; }
  .opt { position: relative; min-height: clamp(96px, 16vh, 150px); border: 5px solid var(--h-ink); border-radius: 26px; background: #fff; box-shadow: 0 6px 0 var(--h-ink); font: 900 clamp(26px, 4vh, 44px)/1.1 'Rubik', 'Varela Round', sans-serif; color: var(--h-ink); cursor: pointer; display: grid; place-items: center; padding: 6px; }
  .opt.pic { font-size: clamp(60px, 10vh, 96px); }
  .opt.en { direction: ltr; }
  .opt .mini { position: absolute; top: 6px; left: 6px; width: 38px; height: 38px; border: 3px solid var(--h-ink); border-radius: 50%; background: #bfeaff; font-size: 18px; display: grid; place-items: center; }
  .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--h-ink); }
  .opt.good { background: #c9ffe6; animation: ch-p .5s ease 2; } .opt.bad { background: #ffd0d0; animation: shake .4s; } .opt.dim { opacity: .45; }
  .opt.tile { min-height: clamp(80px, 12vh, 110px); }
  .slots { direction: ltr; display: flex; gap: 10px; justify-content: center; }
  .slots i { width: clamp(56px, 8vh, 74px); height: clamp(66px, 9vh, 84px); border: 4px solid var(--h-ink); border-radius: 16px; background: #fff; font: 900 clamp(34px, 5vh, 50px)/clamp(58px, 8vh, 76px) 'Rubik', sans-serif; font-style: normal; box-shadow: 0 4px 0 var(--h-ink); }
  .slots i.f { background: #c9ffe6; }
  .groups { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .groups span { padding: 8px 12px; border: 4px dashed var(--h-ink); border-radius: 20px; background: #fff; font-size: clamp(30px, 4.6vh, 44px); }
  .count { font-size: clamp(34px, 5vh, 50px); letter-spacing: 2px; max-width: 900px; }
  .count .minus { opacity: .35; text-decoration: line-through; }
  .mathq { direction: ltr; font: 900 clamp(46px, 8vh, 80px)/1 'Rubik', sans-serif; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  /* הסבר אחרי תשובה */
  .explain { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 5; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 14px 18px; border: 5px solid var(--h-ink); border-radius: 26px; box-shadow: 0 7px 0 var(--h-ink); animation: up .35s var(--h-spring); }
  .explain.ok { background: linear-gradient(180deg, #e2fff2, #b8f5da); } .explain.no { background: linear-gradient(180deg, #fff6e0, #ffe0b0); }
  .explain .ep { font-size: 84px; line-height: 1; }
  .explain .et { text-align: right; } .explain .et b { display: block; font: 900 clamp(22px, 2.6vw, 32px)/1.1 var(--h-font); }
  .explain .et .w { direction: ltr; display: inline-block; font: 900 clamp(30px, 3.6vw, 44px)/1 'Rubik', sans-serif; margin-inline-end: 10px; }
  .explain .et .tr { font-weight: 800; font-size: clamp(18px, 2vw, 24px); }
  .explain .et small { display: block; margin-top: 4px; font-weight: 800; font-size: clamp(15px, 1.6vw, 19px); color: #5b4d7a; }
  .explain .eb { display: flex; gap: 8px; align-items: center; } .explain .eb .spk { width: 64px; height: 64px; font-size: 28px; }
  @keyframes up { from { transform: translateY(120%); } }
  /* --- פרק ו: טקס גדילה --- */
  .cere { position: relative; width: min(900px, 100%); min-height: min(640px, 100%); display: grid; place-items: center; text-align: center; border: 5px solid var(--h-ink); border-radius: 30px; overflow: hidden; box-shadow: 8px 10px 0 var(--h-ink);
    background: repeating-conic-gradient(from 0deg at 50% 55%, #ffd95a 0 8deg, #ff9f1c 8deg 16deg); }
  .cere .rays { position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.45) 0 6deg, transparent 6deg 18deg); animation: spin 18s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cere .inner { position: relative; z-index: 2; display: grid; gap: 12px; justify-items: center; padding: 18px; }
  .cere h2 { margin: 0; font: 900 clamp(34px, 5vw, 64px)/1 var(--h-font); color: #fff; -webkit-text-stroke: 4px var(--h-ink); paint-order: stroke fill; text-shadow: 5px 6px 0 var(--h-ink); }
  .cere .cd { width: min(46vh, 360px); } .cere .cd svg { width: 100%; height: auto; }
  .cere .cd.grow { animation: grow 1.2s var(--h-spring); }
  @keyframes grow { 0% { transform: scale(.6); filter: brightness(3); } 40% { transform: scale(1.15); filter: brightness(1.6); } 100% { transform: scale(1); } }
  .cere .cap { padding: 10px 20px; border: 4px solid var(--h-ink); background: #fff; font: 900 clamp(18px, 2.2vw, 26px)/1.2 var(--h-font); box-shadow: 5px 5px 0 var(--h-ink); }
  .cere .stars { font-size: 70px; letter-spacing: 6px; }
  .apple-fly { position: fixed; z-index: 80; font-size: 44px; pointer-events: none; }
  .gift { width: 170px; height: 170px; font-size: 130px; line-height: 1; cursor: pointer; animation: ch-p 1s ease-in-out infinite; background: none; border: 0; }
  /* --- פרק ז: משחקים --- */
  .toys { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .toy { border: 4px solid var(--h-ink); border-radius: 24px; padding: 14px; text-align: center; background: linear-gradient(180deg, #fff, #e8f7ff); box-shadow: 0 6px 0 var(--h-ink); font-family: var(--h-font); color: var(--h-ink); cursor: pointer; }
  .toy .ic { font-size: 64px; } .toy b { display: block; font-size: 22px; font-weight: 900; } .toy small { font-weight: 800; color: var(--h-text-soft); }
  .toy.lock { background: #e3e6ef; color: #8a93a8; cursor: default; } .toy.lock .ic { filter: grayscale(1); opacity: .5; }
  .game { position: relative; width: min(1100px, 100%); height: min(760px, 100%); border: 5px solid var(--h-ink); border-radius: 30px; overflow: hidden; box-shadow: 8px 10px 0 var(--h-ink); background: #bfeaff; }
  .game canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .game .hud { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; pointer-events: none; }
  .game .x { position: absolute; top: 12px; right: 12px; width: 54px; height: 54px; border: 4px solid var(--h-ink); border-radius: 50%; background: var(--h-magenta); color: #fff; font: 900 22px/1 var(--h-font); box-shadow: 0 4px 0 var(--h-ink); cursor: pointer; z-index: 3; }
  .game .end { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,14,34,.55); z-index: 4; }
  .game .end > div { padding: 22px 30px; border: 5px solid var(--h-ink); border-radius: 26px; background: #fffaf0; text-align: center; box-shadow: 0 7px 0 var(--h-ink); display: grid; gap: 12px; }
  .game .end h2 { margin: 0; font: 900 40px/1 var(--h-font); }
  @media (max-width: 820px) { .lair { grid-template-columns: 1fr; } .opts { grid-template-columns: repeat(2, 1fr); } .wrap { padding-left: 80px; } }
  @media (prefers-reduced-motion: reduce) { .cere .rays, .node.next, .path .st.cur { animation: none; } }
  /* --- הסבר ברור: תוויות "אומרים" / "בעברית" וטיפ צליל --- */
  .explain .et .lab { color: #5b4d7a; font-weight: 800; font-size: .85em; }
  .explain .et .say { display: inline; font: 900 1.05em var(--h-font); color: var(--h-ink); }
  .explain .et small.tip { line-height: 1.5; }
  .explain .et small b { display: inline; font: 900 1em var(--h-font); }
  .explain .et small b.tl, .wb-tip b.tl { display: inline-block; font: 900 1.05em 'Rubik', sans-serif; }
  .tl { display: inline-block; min-width: 1.2em; padding: 0 6px; margin: 0 2px; border-radius: 8px; background: #fff; border: 2px solid var(--h-ink); color: #1b3c8f; font: 900 1.05em 'Rubik', sans-serif; text-align: center; }
  /* --- חזרה על מילים קשות --- */
  .review { display: flex; align-items: center; gap: 14px; width: 100%; margin: 0 0 14px; padding: 12px 18px; border: 5px solid var(--h-ink); border-radius: 24px; background: linear-gradient(180deg, #fff3c4, #ffc93c); box-shadow: 0 6px 0 var(--h-ink); cursor: pointer; font-family: var(--h-font); text-align: right; color: var(--h-ink); }
  .review .ic { font-size: 46px; } .review b { display: block; font-size: clamp(20px, 2.4vw, 28px); } .review small { font-weight: 800; font-size: 16px; } .review .go { margin-inline-start: auto; font-size: 30px; }
  /* --- פרק: המילים שלי --- */
  .wb-head { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; padding: 12px 18px; border: 5px solid var(--h-ink); border-radius: 26px; background: #fffaf0; box-shadow: 0 6px 0 var(--h-ink); color: var(--h-ink); }
  .wb-big { font-size: 64px; } .wb-head h2 { font: 900 clamp(26px, 3vw, 36px) var(--h-font); } .wb-head p { font-weight: 800; }
  .wb-miss { margin-inline-start: auto; padding: 6px 14px; border: 3px solid var(--h-ink); border-radius: 999px; background: #ffc93c; font-weight: 900; white-space: nowrap; }
  .wb-theme { margin: 12px 0; } .wb-theme h3 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font: 900 clamp(20px, 2.4vw, 28px) var(--h-font); color: #fff; -webkit-text-stroke: 1px var(--h-ink); margin-bottom: 8px; }
  .wb-theme h3 small { font: 800 16px var(--h-font); -webkit-text-stroke: 0; color: #cfd8ff; }
  .wb-theme.lock { opacity: .55; }
  .wb-all { padding: 6px 14px; border: 3px solid var(--h-ink); border-radius: 999px; background: #8fe9ff; font: 900 16px var(--h-font); -webkit-text-stroke: 0; cursor: pointer; box-shadow: 0 3px 0 var(--h-ink); }
  .wb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .wcard { position: relative; display: grid; justify-items: center; gap: 2px; padding: 10px 6px; border: 4px solid var(--h-ink); border-radius: 20px; background: #fff; box-shadow: 0 5px 0 var(--h-ink); cursor: pointer; font-family: var(--h-font); color: var(--h-ink); transition: transform .15s var(--h-spring); }
  .wcard .wp { font-size: 46px; line-height: 1.1; } .wcard b { font: 900 24px 'Rubik', sans-serif; color: #1b3c8f; } .wcard .wh { font-weight: 900; font-size: 18px; } .wcard small { font-weight: 700; color: #6a5d87; }
  .wcard.on { transform: translateY(-4px) scale(1.05); background: #e2fff2; }
  .wb-tip { margin: 0 0 12px; padding: 10px 16px; border: 4px solid var(--h-ink); border-radius: 20px; background: #e2fff2; color: var(--h-ink); font-weight: 800; font-size: clamp(16px, 1.8vw, 20px); line-height: 1.55; box-shadow: 0 4px 0 var(--h-ink); }
  .wb-tip .w { font: 900 1.3em 'Rubik', sans-serif; color: #1b3c8f; }
  .wcard.miss::after { content: '🔁'; position: absolute; top: 4px; left: 6px; font-size: 18px; }
</style>
</head>
<body data-captions="off">
  <div class="wrap">
    <div class="top">
      <h1>🐉 מאורת הדרקון</h1>
      <span class="sp"></span>
      <span class="chip" id="apples">🍎 0</span>
      <span class="chip" id="stageChip">⭐ שלב 1</span>
    </div>
