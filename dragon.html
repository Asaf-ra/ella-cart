<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1d0b4a" />
<meta name="apple-mobile-web-app-title" content="מאורת הדרקון" />
<title>מאורת הדרקון — העולם של אלה</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="stylesheet" href="shared/theme.css" />
<style>
  /* =====================================================================
     dragon.html — מאורת הדרקון: הדרקון שלי · משימות דרקון (אנגלית + חשבון) · משחקים עם הדרקון
     פרק א — מסגרת ורקע קומיקס, פרק ב — לשוניות, פרק ג — חדר הדרקון ומסלול 12 השלבים,
     פרק ד — מפת המשימות, פרק ה — נגן השאלות והסבר, פרק ו — טקס גדילה ומתנה, פרק ז — משחקים
     ===================================================================== */
  /* --- פרק א: רקע --- */
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--h-font); color: var(--h-ink); background: var(--h-night);
    background-image: radial-gradient(rgba(255,255,255,.07) 1.4px, transparent 1.6px), radial-gradient(60% 50% at 80% 0%, rgba(255,46,147,.45), transparent 70%), linear-gradient(170deg, #1d0b4a, #3a1177 60%, #5a1b8a);
    background-size: 16px 16px, auto, auto; overflow: hidden; }
  .wrap { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: clamp(118px, 12.5vw, 160px) minmax(0, 1fr); padding: calc(env(safe-area-inset-top) + 12px) 18px 14px 96px; gap: 10px 14px; }
  .wrap > .top { grid-column: 1 / -1; }
  .wrap > .pane { grid-row: 2; grid-column: 2; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top h1 { margin: 0; font: 900 clamp(26px, 3.4vw, 42px)/1 var(--h-font); color: #fff; -webkit-text-stroke: 3px var(--h-ink); paint-order: stroke fill; text-shadow: 4px 5px 0 var(--h-ink); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 4px solid var(--h-ink); border-radius: 999px; background: #fffaf0; font: 900 clamp(16px, 1.8vw, 22px)/1 var(--h-font); box-shadow: 0 4px 0 var(--h-ink); }
  .top .sp { flex: 1; }
  /* --- פרק ב: לשוניות --- */
  /* סיידבר לשוניות (אנכי, בצד): אייקון גדול + שם */
  .tabs { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; gap: 12px; align-self: start; }
  .tab .ti { display: block; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.1; margin-bottom: 4px; }
  .tab { position: relative; min-height: clamp(84px, 13vh, 112px); padding: 10px 4px; line-height: 1.1 !important; font-size: clamp(14px, 1.45vw, 18px) !important; white-space: normal; overflow: visible; word-break: keep-all; border: 4px solid var(--h-ink); border-radius: 20px; background: #fffaf0; font: 900 clamp(16px, 2vw, 24px)/1 var(--h-font); color: var(--h-ink); box-shadow: 0 5px 0 var(--h-ink); cursor: pointer; }
  .tab.on { background: linear-gradient(180deg, #ffd95a, #ff9f1c); transform: translateX(-8px); box-shadow: 0 5px 0 var(--h-ink), 0 0 0 4px rgba(255,255,255,.6); }
  .pane { display: none; min-height: 0; overflow: auto; border: 4px solid var(--h-ink); border-radius: 28px; background: #fffaf0; box-shadow: 7px 8px 0 var(--h-ink); padding: 16px; }
  .pane.on { display: block; }
  /* --- פרק ג: חדר הדרקון --- */
  .lair { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; height: 100%; min-height: 360px; }
  .scene { position: relative; border: 4px solid var(--h-ink); border-radius: 24px; overflow: hidden; min-height: 340px;
    background: radial-gradient(circle at 50% 70%, rgba(255,217,90,.55), transparent 55%), repeating-conic-gradient(from 0deg at 50% 70%, #ffb347 0 7deg, #ff9f1c 7deg 14deg); }
  .scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(180deg, #6cc85a, #3f9a3a); border-top: 4px solid var(--h-ink); }
  .scene .dragon { position: absolute; left: 50%; bottom: 8%; width: min(70%, 380px); transform: translateX(-50%); z-index: 2; cursor: pointer; filter: drop-shadow(0 10px 0 rgba(16,30,54,.25)); transition: width .8s var(--h-spring); }
  .scene .dragon svg { width: 100%; height: auto; display: block; }
  .scene .dragon.bob { animation: dg-bob 2.4s ease-in-out infinite alternate; }
  .scene .dragon.jump { animation: dg-jump .7s var(--h-spring); }
  @keyframes dg-bob { to { transform: translateX(-50%) translateY(-10px); } }
  @keyframes dg-jump { 40% { transform: translateX(-50%) translateY(-60px) scale(1.06); } }
  .info { display: grid; gap: 12px; align-content: start; }
  .dname { font: 900 clamp(28px, 3.4vw, 42px)/1 var(--h-font); }
  .dstage { font-weight: 800; color: var(--h-text-soft); font-size: clamp(15px, 1.7vw, 20px); }
  .meter { height: 26px; border: 4px solid var(--h-ink); border-radius: 999px; background: #fff; overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #3ff2b0, #ffd95a, #ff9f1c); border-radius: 999px; transition: width .8s var(--h-spring); }
  .path { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .path .st { position: relative; aspect-ratio: 1; border: 3px solid var(--h-ink); border-radius: 16px; background: #fff; display: grid; place-items: center; padding: 3px; }
  .path .st svg { width: 100%; height: auto; }
  .path .st.lock { background: #e3e6ef; } .path .st.lock svg { filter: grayscale(1) brightness(.4) opacity(.5); }
  .path .st.cur { background: #fff3b0; box-shadow: 0 0 0 4px #ffc93c; animation: ch-p 1.4s ease-in-out infinite; }
  .path .st b { position: absolute; bottom: -2px; right: 2px; font-size: 12px; }
  @keyframes ch-p { 50% { transform: scale(1.08); } }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; } .acts .h-btn { flex: 1; min-width: 150px; }
  /* --- פרק ג2: טמגוצ'י — מדדים, בועה, טיפול, אמבטיה, שינה, קופסה, ארון --- */
  .scene.night { background: radial-gradient(circle at 80% 18%, #fff3c4 0 26px, transparent 27px), radial-gradient(circle at 50% 70%, rgba(143,233,255,.25), transparent 60%), linear-gradient(180deg, #0b1a3d, #243a7a); }
  .scene.sleeping::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(circle at 80% 16%, #fff3c4 0 30px, transparent 31px), radial-gradient(2px 2px at 20% 20%, #fff, transparent), radial-gradient(2px 2px at 40% 12%, #fff, transparent), radial-gradient(3px 3px at 62% 26%, #fff, transparent), radial-gradient(2px 2px at 12% 42%, #fff, transparent), rgba(8,16,48,.72); animation: nightIn .8s ease; }
  @keyframes nightIn { from { opacity: 0; } }
  .scene.sleeping .dragon { z-index: 4; }
  .bubble { position: absolute; top: 12px; right: 50%; transform: translateX(50%); z-index: 5; max-width: 86%; padding: 10px 16px; border: 4px solid var(--h-ink); border-radius: 22px; background: #fff; box-shadow: 0 5px 0 var(--h-ink); font: 900 clamp(17px, 2vw, 23px)/1.25 var(--h-font); color: var(--h-ink); text-align: center; white-space: nowrap; }
  .bubble::after { content: ""; position: absolute; bottom: -16px; left: 50%; width: 22px; height: 22px; background: #fff; border-right: 4px solid var(--h-ink); border-bottom: 4px solid var(--h-ink); transform: translateX(-50%) rotate(45deg); }
  .bubble.pop { animation: bubPop .4s var(--h-spring); }
  @keyframes bubPop { from { transform: translateX(50%) scale(.6); } }
  .zzz { position: absolute; top: 30%; left: 60%; z-index: 5; font: 900 44px var(--h-font); color: #fff; -webkit-text-stroke: 2px var(--h-ink); animation: zz 2s ease-in-out infinite; pointer-events: none; }
  .zzz small { font-size: .6em; margin-inline-start: 4px; } .zzz.big { font-size: 64px; }
  @keyframes zz { 50% { transform: translate(10px, -16px) rotate(8deg); opacity: .6; } }
  .giftbox { position: absolute; bottom: 24%; right: 6%; z-index: 4; font-size: 58px; background: none; border: 0; cursor: pointer; animation: gbox 1.2s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(16,30,54,.3)); }
  .giftbox b { position: absolute; top: -4px; left: -6px; min-width: 30px; height: 30px; border: 3px solid var(--h-ink); border-radius: 999px; background: var(--h-gold); font: 900 16px/24px var(--h-font); }
  @keyframes gbox { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-8px); } }
  .ritem { position: absolute; z-index: 1; font-size: clamp(40px, 5vw, 64px); filter: drop-shadow(0 6px 0 rgba(16,30,54,.25)); pointer-events: none; }
  .r-bed { bottom: 16%; left: 4%; font-size: clamp(60px, 7vw, 90px); } .r-ball { bottom: 14%; right: 24%; } .r-plant { bottom: 18%; right: 3%; } .r-teddy { bottom: 15%; left: 24%; }
  .r-lamp { top: 26%; left: 6%; } .r-kite { top: 22%; right: 8%; animation: gbox 3s ease-in-out infinite; } .r-cake { bottom: 13%; left: 40%; font-size: clamp(30px, 3.6vw, 44px); }
  .nm-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .streak { padding: 6px 12px; border: 3px solid var(--h-ink); border-radius: 999px; background: linear-gradient(180deg, #ffe7a0, #ffb13b); font: 900 18px var(--h-font); white-space: nowrap; box-shadow: 0 3px 0 var(--h-ink); }
  .needs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .need { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; }
  .need .ni { grid-row: 1 / 3; font-size: 30px; } .need .nl { font: 900 16px var(--h-font); } .need .nl small { color: #6a5d87; font-family: 'Rubik', sans-serif; }
  .need .nb { height: 16px; border: 3px solid var(--h-ink); border-radius: 999px; background: #fff; overflow: hidden; } .need .nb i { display: block; height: 100%; border-radius: 999px; transition: width .6s; }
  .need.low .ni { animation: gbox 1s ease-in-out infinite; }
  .care { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cbtn { position: relative; display: grid; justify-items: center; gap: 0; padding: 8px 4px 6px; border: 4px solid var(--h-ink); border-radius: 18px; background: #fff; box-shadow: 0 4px 0 var(--h-ink); font: 900 17px/1.15 var(--h-font); color: var(--h-ink); cursor: pointer; transition: transform .12s var(--h-spring); }
  .cbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--h-ink); }
  .cbtn b { font-size: 30px; line-height: 1.1; }
  .cbtn.sickb { background: linear-gradient(180deg, #ffe0e6, #ff9fb0); animation: ch-p 1.2s ease-in-out infinite; } .cbtn small { font-size: 13px; color: #6a5d87; } .cbtn i { font: 800 12px 'Rubik', sans-serif; color: #1b3c8f; font-style: normal; }
  .cbtn.cgift { background: linear-gradient(180deg, #fff3c4, #ffc93c); animation: ch-p 1.4s ease-in-out infinite; }
  .path { grid-template-columns: repeat(12, 1fr); gap: 4px; } .path .st { border-radius: 10px; border-width: 2px; } .path .st b { font-size: 10px; }
  .scene.bathing { cursor: grab; touch-action: none; }
  .scene.bathing .dragon { z-index: 4; bottom: 14%; width: min(58%, 320px); }
  .tub { position: absolute; left: 50%; bottom: 4%; width: min(78%, 420px); height: 22%; transform: translateX(-50%); z-index: 3; border: 5px solid var(--h-ink); border-radius: 0 0 120px 120px; background: linear-gradient(180deg, #fff, #dfe9ff); box-shadow: 0 6px 0 var(--h-ink); pointer-events: none; }
  .tub .water { position: absolute; left: 4%; right: 4%; top: -14px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 30% 50%, #fff 0 12px, transparent 13px), radial-gradient(circle at 70% 40%, #fff 0 16px, transparent 17px), #8fe9ff; border: 3px solid var(--h-ink); }
  .sbar { position: absolute; left: 10%; right: 10%; bottom: 10px; z-index: 6; height: 30px; border: 4px solid var(--h-ink); border-radius: 999px; background: #fff; overflow: hidden; pointer-events: none; }
  .sbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8fe9ff, #3ff2b0); transition: width .15s; }
  .sbar.night i { background: linear-gradient(90deg, #8a9cff, #ffd95a); }
  .sbar span { position: absolute; inset: 0; display: grid; place-items: center; font: 900 16px var(--h-font); color: var(--h-ink); }
  .sdone { position: absolute; top: 12px; left: 12px; z-index: 7; padding: 8px 14px; border: 4px solid var(--h-ink); border-radius: 999px; background: #3ff2b0; font: 900 18px var(--h-font); cursor: pointer; box-shadow: 0 4px 0 var(--h-ink); }
  .bub { position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, -50%); animation: bubUp 1.1s ease-out forwards; }
  @keyframes bubUp { to { transform: translate(-50%, -120px) scale(1.4); opacity: 0; } }
  .drop { position: absolute; top: 0; z-index: 6; font-size: 30px; pointer-events: none; animation: dropF .9s ease-in forwards; }
  @keyframes dropF { to { transform: translateY(300px); opacity: 0; } }
  .bigbox { font-size: 140px; line-height: 1; cursor: pointer; margin: 10px auto; user-select: none; }
  .bigbox.shake { animation: bshake .45s ease; }
  @keyframes bshake { 25% { transform: rotate(-14deg) scale(1.1); } 75% { transform: rotate(14deg) scale(1.1); } }
  .gdragon { width: min(40vh, 280px); margin: 0 auto; } .gdragon svg { width: 100%; height: auto; }
  .closet { position: relative; width: min(94vw, 900px); max-height: 92vh; overflow: auto; padding: 20px 24px; border: 5px solid var(--h-ink); border-radius: 30px; background: #fffaf0; box-shadow: 0 8px 0 var(--h-ink); color: var(--h-ink); }
  .closet .x { position: absolute; top: 12px; left: 12px; width: 52px; height: 52px; border: 4px solid var(--h-ink); border-radius: 50%; background: var(--h-magenta); color: #fff; font: 900 22px var(--h-font); cursor: pointer; }
  .closet h2 { font: 900 clamp(24px, 3vw, 34px) var(--h-font); text-align: center; } .closet h3 { font: 900 20px var(--h-font); margin: 10px 0 6px; }
  .cl-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; align-items: start; } .cl-prev svg { width: 100%; height: auto; }
  .cl-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .cl-it { display: grid; justify-items: center; padding: 8px 4px; border: 4px solid var(--h-ink); border-radius: 18px; background: #fff; box-shadow: 0 4px 0 var(--h-ink); cursor: pointer; font-family: var(--h-font); }
  .cl-it b { font-size: 38px; } .cl-it small { font-weight: 800; font-size: 14px; } .cl-it.on { background: #b6ffdc; box-shadow: 0 0 0 4px #3ff2b0, 0 4px 0 var(--h-ink); } .cl-it.lock { opacity: .45; cursor: default; }
  .cl-note { margin-top: 10px; font-weight: 800; color: #6a5d87; }
  @media (max-width: 820px) { .cl-grid { grid-template-columns: 1fr; } .care { grid-template-columns: repeat(2, 1fr); } }
  /* --- פרק ד: מפת המשימות --- */
  .track { margin-bottom: 18px; border: 4px solid var(--h-ink); border-radius: 24px; overflow: hidden; }
  .track h2 { margin: 0; padding: 10px 16px; font: 900 clamp(20px, 2.4vw, 28px)/1.1 var(--h-font); border-bottom: 4px solid var(--h-ink);
    background: radial-gradient(rgba(255,255,255,.35) 1.6px, transparent 1.8px) 0 0/12px 12px, var(--tc); }
  .track h2 small { font-size: .6em; font-weight: 800; }
  .nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 14px; background: color-mix(in srgb, var(--tc) 10%, #fffaf0); }
  .node { position: relative; border: 4px solid var(--h-ink); border-radius: 22px; background: #fff; padding: 12px 8px 10px; text-align: center; font-family: var(--h-font); color: var(--h-ink); box-shadow: 0 5px 0 var(--h-ink); cursor: pointer; }
  .node .ic { font-size: 46px; line-height: 1.1; } .node b { display: block; font-size: 19px; font-weight: 900; }
  .node .stars { font-size: 18px; letter-spacing: 2px; color: #c9ced9; } .node .stars .on { color: #ffbd24; }
  .node small { display: block; font-weight: 800; color: var(--h-text-soft); font-size: 13px; }
  .node.next { background: linear-gradient(180deg, #fff, #fff3b0); animation: ch-p 1.5s ease-in-out infinite; }
  .node.lock { background: #e3e6ef; color: #8a93a8; cursor: default; box-shadow: 0 3px 0 #8a93a8; border-color: #8a93a8; }
  .node.lock .ic { filter: grayscale(1); opacity: .5; }
  .node .num { position: absolute; top: -12px; right: -8px; width: 32px; height: 32px; border: 3px solid var(--h-ink); border-radius: 50%; background: var(--tc); font: 900 16px/26px var(--h-font); }
  /* --- פרק ה: נגן השאלות --- */
  .ov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px; background: rgba(8,14,34,.72); }
  .play { position: relative; width: min(1100px, 100%); height: min(760px, 100%); display: grid; grid-template-rows: auto 1fr auto; gap: 10px; border: 5px solid var(--h-ink); border-radius: 30px; background: #fffaf0; box-shadow: 8px 10px 0 var(--h-ink); padding: 14px 18px; overflow: hidden;
    background-image: radial-gradient(rgba(255,159,28,.13) 2px, transparent 2.4px); background-size: 20px 20px; }
  .ph { display: flex; align-items: center; gap: 12px; }
  .ph .x { width: 54px; height: 54px; border: 4px solid var(--h-ink); border-radius: 50%; background: var(--h-magenta); color: #fff; font: 900 22px/1 var(--h-font); box-shadow: 0 4px 0 var(--h-ink); cursor: pointer; }
  .ph h3 { margin: 0; flex: 1; font: 900 clamp(20px, 2.4vw, 28px)/1 var(--h-font); }
  .pips { display: flex; gap: 6px; } .pips i { width: 22px; height: 22px; border: 3px solid var(--h-ink); border-radius: 50%; background: #fff; }
  .pips i.ok { background: #3ff2b0; } .pips i.no { background: #ffb3b3; } .pips i.cur { background: #ffd95a; transform: scale(1.2); }
  .qbox { display: grid; grid-template-rows: auto auto 1fr; gap: 12px; min-height: 0; text-align: center; }
  .qins { font: 900 clamp(22px, 2.8vw, 34px)/1.2 var(--h-font); }
  .qmain { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .bigpic { display: grid; place-items: center; width: clamp(150px, 22vh, 210px); aspect-ratio: 1; border: 5px solid var(--h-ink); border-radius: 30px; background: #fff; font-size: clamp(90px, 14vh, 130px); box-shadow: 0 6px 0 var(--h-ink); }
  .bigword { direction: ltr; font: 900 clamp(48px, 8vh, 84px)/1 'Rubik', 'Varela Round', sans-serif; letter-spacing: 3px; padding: 10px 24px; border: 5px solid var(--h-ink); border-radius: 24px; background: #fff; box-shadow: 0 6px 0 var(--h-ink); }
  .bigword .gap { display: inline-block; min-width: .8em; border-bottom: 6px solid var(--h-magenta); color: var(--h-magenta); }
  .spk { width: clamp(70px, 10vh, 96px); height: clamp(70px, 10vh, 96px); border: 5px solid var(--h-ink); border-radius: 50%; background: linear-gradient(180deg, #7fe3ff, #29c5ff); font-size: clamp(34px, 5vh, 46px); box-shadow: 0 6px 0 var(--h-ink); cursor: pointer; }
  .spk.slow { background: linear-gradient(180deg, #bff5d9, #3ff2b0); }
  .spk.pulse { animation: ch-p .9s ease-in-out infinite; }
  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(10px, 1.4vw, 16px); align-content: center; }
  .opt { position: relative; min-height: clamp(96px, 16vh, 150px); border: 5px solid var(--h-ink); border-radius: 26px; background: #fff; box-shadow: 0 6px 0 var(--h-ink); font: 900 clamp(26px, 4vh, 44px)/1.1 'Rubik', 'Varela Round', sans-serif; color: var(--h-ink); cursor: pointer; display: grid; place-items: center; padding: 6px; }
  .opt.pic { font-size: clamp(60px, 10vh, 96px); }
  .opt.en { direction: ltr; }
  .opt .mini { position: absolute; top: 6px; left: 6px; width: 38px; height: 38px; border: 3px solid var(--h-ink); border-radius: 50%; background: #bfeaff; font-size: 18px; display: grid; place-items: center; }
  .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--h-ink); }
  .opt.good { background: #c9ffe6; animation: ch-p .5s ease 2; } .opt.bad { background: #ffd0d0; animation: shake .4s; } .opt.dim { opacity: .45; }
  .opt.tile { min-height: clamp(80px, 12vh, 110px); }
  .slots { direction: ltr; display: flex; gap: 10px; justify-content: center; }
  .slots i { width: clamp(56px, 8vh, 74px); height: clamp(66px, 9vh, 84px); border: 4px solid var(--h-ink); border-radius: 16px; background: #fff; font: 900 clamp(34px, 5vh, 50px)/clamp(58px, 8vh, 76px) 'Rubik', sans-serif; font-style: normal; box-shadow: 0 4px 0 var(--h-ink); }
  .slots i.f { background: #c9ffe6; }
  .groups { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .groups span { padding: 8px 12px; border: 4px dashed var(--h-ink); border-radius: 20px; background: #fff; font-size: clamp(30px, 4.6vh, 44px); }
