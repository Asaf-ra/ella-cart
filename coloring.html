<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2a1260" />
<meta name="apple-mobile-web-app-title" content="ציור קסם" />
<title>ציור קסם — העולם של אלה</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
<link rel="stylesheet" href="shared/theme.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(180deg, #cdb4ff 0%, #ffd6ec 55%, #fff3c9 100%);
    font-family: 'Varela Round', 'Heebo', -apple-system, sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    direction: rtl;
  }

  /* ----- סרגל עליון: דמויות + כלים ----- */
  #topbar {
    position: fixed; top: 8px; right: 12px; left: 90px; height: 84px;
    display: flex; align-items: center; gap: 10px; z-index: 20;
  }
  .char-thumb {
    width: 76px; height: 80px; border: none; border-radius: 18px;
    background: rgba(255,255,255,.65); padding: 6px; cursor: pointer;
    box-shadow: 0 3px 8px rgba(90,61,92,.18);
    transition: transform .15s;
  }
  .char-thumb img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .char-thumb.active { background: #fff; transform: scale(1.12); box-shadow: 0 0 0 4px #ffd24c, 0 4px 10px rgba(90,61,92,.25); }
  .tool-btn {
    width: 72px; height: 80px; border: none; border-radius: 18px;
    background: rgba(255,255,255,.65); font-size: 40px; cursor: pointer;
    box-shadow: 0 3px 8px rgba(90,61,92,.18); transition: transform .15s;
  }
  .tool-btn.active { background: #fff; transform: scale(1.1); box-shadow: 0 0 0 4px #b28dff, 0 4px 10px rgba(90,61,92,.25); }
  .tool-btn:active { transform: scale(.9); }
  #tools { margin-inline-start: auto; display: flex; gap: 10px; }

  /* ----- פלטת צבעים (צד שמאל, מתחת לכפתור הבית) ----- */
  #palette {
    position: fixed; left: 10px; top: 100px; bottom: 12px; width: 150px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    align-content: start; z-index: 20;
  }
  .swatch {
    width: 66px; height: 66px; border-radius: 50%; border: 5px solid rgba(255,255,255,.75);
    cursor: pointer; box-shadow: 0 3px 8px rgba(90,61,92,.25);
    transition: transform .15s;
  }
  .swatch.active { transform: scale(1.22); border-color: #fff; box-shadow: 0 0 0 4px #5a3d5c33, 0 4px 12px rgba(90,61,92,.35); }

  /* ----- אזור העבודה ----- */
  #stage {
    position: fixed; top: 100px; bottom: 12px; left: 175px; right: 12px;
    background: rgba(255,255,255,.88); border-radius: 28px;
    box-shadow: 0 8px 30px rgba(90,61,92,.20);
    overflow: hidden; z-index: 10;
  }
  #svgHolder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #svgHolder svg { height: 96%; width: auto; max-width: 96%; }
  #svgHolder .colorable { cursor: pointer; transition: fill .25s ease; }
  #drawCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  body.draw-mode #drawCanvas { display: block; }
  body.draw-mode #svgHolder { display: none; }
  #fxCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  /* ----- גלריה ----- */
  #gallery {
    position: fixed; inset: 0; z-index: 40; background: rgba(90,61,92,.55);
    display: none; align-items: center; justify-content: center;
  }
  #gallery.open { display: flex; }
  #galleryBox {
    background: #fff; border-radius: 28px; padding: 24px; max-width: 84%; max-height: 82%;
    overflow: auto; display: grid; grid-template-columns: repeat(4, 170px); gap: 16px;
  }
  .gal-item { width: 170px; height: 150px; border-radius: 18px; background: #f6effc;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .gal-item svg, .gal-item img { max-width: 92%; max-height: 92%; }
  .gal-empty { grid-column: 1 / -1; font-size: 30px; color: #5a3d5c; text-align: center; padding: 30px; }

  /* ===== סטודיו הציור של הגיבורה — שכבת עיצוב 2026 (דורסת את העיצוב הבהיר) ===== */
  body { background: radial-gradient(55% 60% at 85% 8%, rgba(255,46,147,.4), transparent 70%), linear-gradient(170deg, #1d0b4a, #3a1177 55%, #6a1b8f); font-family: var(--h-font); }
  .char-thumb { background: #fffaf0; border: 3px solid var(--h-ink); box-shadow: 0 4px 0 var(--h-ink); }
  .char-thumb.active { background: #fff3b0; box-shadow: 0 4px 0 var(--h-ink), 0 0 0 4px var(--h-magenta); }
  #chars { overflow-x: auto; scrollbar-width: none; padding: 6px 4px; max-width: calc(100vw - 600px); }
  #chars::-webkit-scrollbar { display: none; }
  .char-thumb { flex: 0 0 auto; }
  .tool-btn { background: #fffaf0; border: 3px solid var(--h-ink); box-shadow: 0 4px 0 var(--h-ink); }
  .tool-btn.active { background: linear-gradient(180deg, #ffd95a, #ff9f1c); box-shadow: 0 4px 0 var(--h-ink), 0 0 0 4px rgba(255,201,60,.5); }
  .swatch { border: 4px solid var(--h-ink); box-shadow: 0 4px 0 var(--h-ink); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 4px var(--h-ink), 0 0 18px rgba(255,255,255,.7); }
  #stage { background: #fffaf0; border: 5px solid var(--h-ink); box-shadow: 7px 8px 0 var(--h-ink), 0 20px 40px rgba(8,2,26,.45); }
  #galleryBox { border: 5px solid var(--h-ink); box-shadow: 7px 8px 0 var(--h-ink); background: #fffaf0; }
  #gallery { background: radial-gradient(circle, rgba(58,17,119,.8), rgba(10,4,30,.92)); }
  .gal-item { border: 3px solid var(--h-ink); }
</style>
</head>
<body>

<div id="topbar">
  <!-- דמויות לצביעה נוצרות ב-JS -->
  <div id="chars" style="display:flex; gap:10px;"></div>
  <div id="tools">
    <button class="tool-btn" id="btnColorMode" title="צביעה">🖍️</button>
    <button class="tool-btn" id="btnDrawMode"  title="ציור קסם">🪄</button>
    <button class="tool-btn" id="btnUndo"      title="ביטול">↩️</button>
    <button class="tool-btn" id="btnClear"     title="ניקוי">🧽</button>
    <button class="tool-btn" id="btnSave"      title="שמירה">💾</button>
    <button class="tool-btn" id="btnGallery"   title="גלריה">🖼️</button>
  </div>
</div>

<div id="palette"></div>

<div id="stage">
  <div id="svgHolder"></div>
  <canvas id="drawCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>
</div>

<div id="gallery"><div id="galleryBox"></div></div>

<script src="js/audio.js"></script>
<script src="shared/kids-ui.js"></script>
<script src="shared/wallet.js"></script>
<script src="shared/hero-avatar.js"></script>
<script src="shared/hero-rewards.js"></script>
<script src="js/coloring.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () { KidsUI.HomeButton.attach(); });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
