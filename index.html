<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1d0b4a" />
<meta name="apple-mobile-web-app-title" content="עולם הגיבורות" />
<title>העולם של אלה — גיבורת-העל</title>
<link rel="manifest" href="manifest.json" />
<!-- אייקון PNG ל-iPad (Safari לא תומך ב-SVG כאייקון מסך הבית) -->
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
<!-- מסכי פתיחה לאייפד לרוחב (מוצגים בזמן פתיחת האפליקציה מהמסך הבית) -->
<link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (orientation: landscape)" href="assets/splash/splash-2732x2048.png" />
<link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (orientation: landscape)" href="assets/splash/splash-2388x1668.png" />
<link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (orientation: landscape)" href="assets/splash/splash-2360x1640.png" />
<link rel="apple-touch-startup-image" media="(device-width: 744px) and (device-height: 1133px) and (orientation: landscape)" href="assets/splash/splash-2266x1488.png" />
<link rel="apple-touch-startup-image" media="(device-width: 810px) and (device-height: 1080px) and (orientation: landscape)" href="assets/splash/splash-2160x1620.png" />
<link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (orientation: landscape)" href="assets/splash/splash-2048x1536.png" />
<link rel="stylesheet" href="shared/theme.css" />
<style>
  /* ===== מטה הגיבורים — מסך הבית =====
     פרק א — בסיס ופריסה | פרק ב — סרגל עליון | פרק ג — הגיבורה
     פרק ד — כרטיסי משימה | פרק ה — פתיח קולנועי | פרק ו — חנות | פרק ז — סיבוב מסך
     פרק ח — משימות היום, חיית המחמד ואזור ההורים */

  /* --- פרק א: בסיס --- */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html { background: var(--h-night); }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  /* body שקוף — אחרת הוא מסתיר את שכבות הרקע (z-index שלילי) */
  body { background: transparent; }
  body { font-family: var(--h-font); color: #fff; touch-action: manipulation; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  .hq {
    position: relative; height: 100dvh; display: grid;
    grid-template-rows: auto 1fr; gap: 1.5vh;
    padding: max(14px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
  }

  /* --- פרק ב: סרגל עליון --- */
  .topbar { display: flex; align-items: center; gap: 14px; }
  .topbar .h-hud { min-width: min(290px, 25vw); }
  .topbar .spacer { flex: 1; }
  .icon-btn { min-width: 64px; padding: 10px 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: clamp(16px, 1.7vw, 22px); }
  .icon-btn .ico { font-size: 28px; line-height: 1; }
  .gift-btn { animation: gift 1.2s ease-in-out infinite; }
  @keyframes gift { 0%,100% { transform: rotate(-4deg) scale(1); } 50% { transform: rotate(4deg) scale(1.08); } }

  /* --- פרק ג: הגיבורה + לוגו --- */
  .stage { display: grid; grid-template-columns: auto 1.35fr 1fr; gap: 2vw; align-items: center; min-height: 0; }
  /* --- פרק ג0: סיידבר קבוצות --- */
  .topbar .in-rail { display: none; }                         /* תחפושות/שדרוגים/אלבום עברו לקבוצה "הגיבורה שלי" */
  .rail { display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); align-self: center; }
  .rail button { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px; width: clamp(132px, 13.5vw, 178px); min-height: clamp(58px, 9vh, 78px); padding: 8px 12px;
    border: 4px solid var(--h-ink); border-radius: 22px; background: var(--h-paper); color: var(--h-ink); font: 900 clamp(16px, 1.75vw, 22px)/1.1 var(--h-font); text-align: right;
    box-shadow: 0 5px 0 var(--h-ink); cursor: pointer; transition: transform .16s var(--h-spring), background .2s; }
  .rail button .ri { font-size: clamp(28px, 3vw, 38px); line-height: 1; }
  .rail button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--h-ink); }
  .rail button.on { background: linear-gradient(180deg, var(--g1, #fff3c4), var(--g2, #ffc93c)); transform: translateX(-10px); box-shadow: 0 5px 0 var(--h-ink), 0 0 0 4px rgba(255,255,255,.55); }
  .rail button .rb { position: absolute; top: -8px; left: -8px; min-width: 26px; height: 26px; padding: 0 5px; border: 3px solid var(--h-ink); border-radius: 999px; background: var(--h-magenta); color: #fff; font: 900 13px/20px var(--h-font); text-align: center; }
  .missions .mission.off { display: none; }
  .hero-col { position: relative; display: grid; grid-template-rows: auto 1fr; justify-items: center; align-items: center; gap: 1vh; height: 100%; min-height: 0; }
  .spot { /* זרקור מאחורי הגיבורה */
    position: absolute; top: 18%; width: min(34vw, 52vh); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,201,60,.55), rgba(255,46,147,.25) 45%, transparent 70%);
    animation: pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
  .hero-wrap { position: relative; width: min(24vw, 40vh); cursor: pointer; animation: h-float 2.6s ease-in-out infinite alternate; }
  .hero-wrap svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); }
  .hero-wrap.zap { animation: zap .6s var(--h-spring); }
  @keyframes zap { 30% { transform: scale(1.12) rotate(-4deg); } 60% { transform: scale(.96) rotate(3deg); } }
  .nameplate {
    position: relative; margin-top: -1vh; padding: 8px 22px; border: 4px solid var(--h-ink); border-radius: 16px;
    background: var(--h-gold); color: var(--h-ink); font-weight: 900; font-size: clamp(18px, 2.2vw, 26px);
    transform: rotate(-2deg); box-shadow: 0 5px 0 var(--h-ink);
  }
  .logo { text-align: center; margin-bottom: 2vh; }
  .logo h1 {
    font-size: clamp(40px, 6.4vw, 84px); font-weight: 900; line-height: .95; letter-spacing: 1px;
    color: #fff; -webkit-text-stroke: 5px var(--h-ink); paint-order: stroke fill;
    text-shadow: 5px 6px 0 var(--h-ink), 0 0 30px rgba(255,46,147,.7);
    transform: rotate(-2deg);
  }
  .logo h1 em { font-style: normal; color: var(--h-gold); }
  .logo p { margin-top: 1vh; font-weight: 800; font-size: clamp(16px, 2vw, 24px); color: #ffd9f0; }

  /* --- פרק ד: כרטיסי משימה --- */
  .missions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 1.6vw, 20px); }
  .missions .mission { min-height: clamp(120px, 22vh, 200px); }
  .mission {
    --c1: #ff4fa3; --c2: #8b1a8f;
    position: relative; overflow: hidden; min-height: clamp(96px, 17vh, 160px);
    border: 5px solid var(--h-ink); border-radius: 26px; padding: 12px 12px; cursor: pointer; text-align: right;
    background: linear-gradient(150deg, var(--c1), var(--c2)); color: #fff;
    box-shadow: 0 8px 0 var(--h-ink), 0 18px 30px rgba(0,0,0,.35);
    transition: transform .16s var(--h-spring);
    display: grid; grid-template-columns: 1fr auto; align-items: end;
    animation: card-in .6s var(--h-spring) both;
  }
  .mission:nth-child(2) { animation-delay: .08s; } .mission:nth-child(3) { animation-delay: .16s; } .mission:nth-child(4) { animation-delay: .24s; }
  .mission:nth-child(5) { animation-delay: .32s; } .mission:nth-child(6) { animation-delay: .4s; } .mission:nth-child(7) { animation-delay: .48s; }
  @keyframes card-in { from { transform: translateY(40px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  .mission:active { transform: translateY(5px) scale(.97); box-shadow: 0 3px 0 var(--h-ink), 0 8px 14px rgba(0,0,0,.3); }
  .mission::before { /* קווי מהירות בתוך הכרטיס */
    content: ""; position: absolute; inset: -40%;
    background: repeating-conic-gradient(from 10deg at 85% 25%, rgba(255,255,255,.10) 0 4deg, transparent 4deg 12deg);
  }
  .mission::after { /* ברק עליון */
    content: ""; position: absolute; left: 12px; right: 12px; top: 8px; height: 34%; border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent);
  }
  .mission .m-text { position: relative; z-index: 1; }
  .mission .m-tag { display: inline-block; padding: 3px 12px; border: 3px solid var(--h-ink); border-radius: 999px; background: #fff; color: var(--h-ink); font-weight: 900; font-size: 14px; margin-bottom: 6px; }
  .mission h2 { font-size: clamp(18px, 2.1vw, 28px); font-weight: 900; line-height: 1; -webkit-text-stroke: 2px var(--h-ink); paint-order: stroke fill; text-shadow: 2px 3px 0 var(--h-ink); }
  .mission p { margin-top: 5px; font-weight: 700; font-size: clamp(12px, 1.2vw, 15px); opacity: .95; }
  .mission .m-ico { position: relative; z-index: 1; font-size: clamp(38px, 4.4vw, 64px); line-height: 1; filter: drop-shadow(3px 5px 0 rgba(27,16,54,.6)); animation: bob 2.4s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-4px) rotate(-5deg); } to { transform: translateY(5px) rotate(5deg); } }
  .mission.main { grid-column: span 2; --c1: #ffd95a; --c2: #ff7a1c; color: var(--h-ink); min-height: clamp(110px, 20vh, 180px); }
  .mission.main h2 { font-size: clamp(24px, 3vw, 38px); }
  .mission.main p { font-size: clamp(13px, 1.4vw, 17px); }
  .mission.main .m-ico { font-size: clamp(54px, 6.4vw, 86px); }
  .mission.main h2 { color: #fff; }
  .mission.main .m-tag { background: var(--h-magenta); color: #fff; }
  .mission.cart { --c1: #ff5fb0; --c2: #b3126b; }
  .mission.color { --c1: #a98bff; --c2: #4b1fb8; }
  .mission.balloons { --c1: #3fd8ff; --c2: #1459b8; }
  .mission.dragon { --c1: #ffb347; --c2: #d8261c; }
  .mission.dragon .m-ico { animation: dg-wiggle 2.2s ease-in-out infinite; }
  @keyframes dg-wiggle { 50% { transform: rotate(-8deg) scale(1.08); } }
  .mission.flight { --c1: #3ff2b0; --c2: #0f7a8c; }
  .mission.stories { --c1: #ff9f6b; --c2: #d6336c; }
  .mission.enmis { --c1: #5cc8ff; --c2: #2a4fd8; } .mission.words { --c1: #3ff2b0; --c2: #1b8a6a; }
  .missions .mission.wide { grid-column: span 2; }
  .missions .mission.main.narrow { grid-column: auto; min-height: clamp(120px, 22vh, 200px); }
  .missions .mission.main.narrow h2 { font-size: clamp(20px, 2.3vw, 30px); } .missions .mission.main.narrow .m-ico { font-size: clamp(42px, 4.8vw, 66px); } .missions .mission.main.narrow p { font-size: clamp(12px, 1.2vw, 15px); }
  .mission.kitchen { --c1: #ffd95a; --c2: #ff7a1c; color: var(--h-ink); } .mission.kitchen h2 { color: #fff; }
  .mission.clinic { --c1: #8fe9ff; --c2: #2a8fd8; }
  .mission.me { --c1: #ff5fb0; --c2: #8b1a8f; } .mission.me2 { --c1: #ffc93c; --c2: #ff7a1c; } .mission.me3 { --c1: #3ff2b0; --c2: #0f7a8c; }
  .mission.boss { --c1: #8b5cff; --c2: #2a0b5e; }
  .mission.boss.won { --c1: #ffd95a; --c2: #3ff2b0; }
  .mission .m-tag.hot { background: var(--h-gold); }

  /* --- פרק ה: פתיח קולנועי ("ההשתנות") --- */
  .intro { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; cursor: pointer; background: #0b0420; overflow: hidden; }
  .intro.gone { animation: intro-out .5s ease forwards; pointer-events: none; }
  @keyframes intro-out { to { opacity: 0; transform: scale(1.1); } }
  .intro::before { content: ""; position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
    background: repeating-conic-gradient(rgba(255,46,147,.22) 0 3deg, transparent 3deg 9deg); animation: h-spin 30s linear infinite; }
  .intro-inner { position: relative; text-align: center; }
  .intro-hero { width: min(34vw, 46vh); margin: 0 auto; opacity: 0; animation: hero-in 1s .35s var(--h-spring) forwards; }
  @keyframes hero-in { from { opacity: 0; transform: scale(.3) translateY(80px); } to { opacity: 1; transform: none; } }
  .intro h1 { margin-top: 2vh; font-size: clamp(38px, 6vw, 80px); font-weight: 900; color: #fff; -webkit-text-stroke: 5px var(--h-ink); paint-order: stroke fill; text-shadow: 5px 6px 0 var(--h-magenta); opacity: 0; animation: hero-in .8s .9s var(--h-spring) forwards; }
  .intro .tap { margin-top: 3vh; display: inline-block; opacity: 0; animation: hero-in .6s 1.5s ease forwards, tap 1.4s 2.1s ease-in-out infinite; }
  @keyframes tap { 50% { transform: scale(1.08); } }
  .flash { position: fixed; inset: 0; z-index: 9100; background: #fff; pointer-events: none; animation: flash .7s ease forwards; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

  /* --- פרק ו: חנות השדרוגים --- */
  .shop-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
  .shop-item { display: grid; justify-items: center; gap: 4px; padding: 12px 10px; border: 4px solid var(--h-ink); border-radius: 22px; background: #fff; box-shadow: 0 4px 0 var(--h-ink); }
  .shop-item .ico { font-size: 44px; line-height: 1; }
  .shop-item b { font-size: 19px; }
  .shop-item small { font-size: 14px; color: var(--h-text-soft); font-weight: 700; min-height: 34px; text-align: center; }
  .shop-item .h-btn { min-height: 48px; padding: 8px 16px; font-size: 18px; }
  .shop-item .owned { font-weight: 900; color: #139b6c; font-size: 18px; padding: 10px; }
  .shop-card { width: min(96vw, 900px) !important; }
  .shop-close { position: absolute; top: 12px; left: 12px; width: 52px; height: 52px; border: 4px solid var(--h-ink); border-radius: 50%; background: var(--h-magenta); color: #fff; font: 900 22px/1 var(--h-font); box-shadow: 0 4px 0 var(--h-ink); cursor: pointer; }

  /* --- פרק ח: משימות היום, חיית המחמד, הורים --- */
  .quest { position: relative; z-index: 3; display: grid; gap: 6px; padding: 8px 12px 10px; border: 4px solid var(--h-ink); border-radius: 20px; background: var(--h-paper); color: var(--h-ink); box-shadow: 0 5px 0 var(--h-ink); cursor: pointer; transition: transform .15s var(--h-spring); min-width: min(30vw, 360px); }
  .quest:active { transform: scale(.97); }
  .quest .q-title { font: 900 clamp(15px, 1.6vw, 19px)/1 var(--h-font); display: flex; justify-content: space-between; gap: 8px; }
  .quest .q-list { display: flex; gap: 6px; justify-content: center; }
  .quest .q-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 3px solid var(--h-ink); border-radius: 999px; background: #fff; font: 900 15px/1 var(--h-font); }
  .quest .q-chip.done { background: linear-gradient(180deg, #b6ffdc, #3ff2b0); }
  .quest.ready { animation: quest-glow 1.2s ease-in-out infinite; background: linear-gradient(180deg, #fff3b0, #ffc93c); }
  @keyframes quest-glow { 50% { box-shadow: 0 5px 0 var(--h-ink), 0 0 0 6px rgba(255,201,60,.6), 0 0 30px rgba(255,201,60,.8); transform: scale(1.03); } }
  .hero-stack { position: relative; }
  .hero-stack .pet-mini { left: -18%; bottom: 8%; }
  .q-rows { display: grid; gap: 10px; margin: 14px 0; text-align: right; }
  .q-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 3px solid var(--h-ink); border-radius: 18px; background: #fff; }
  .q-row .qi { font-size: 34px; }
  .q-row b { font-size: 18px; }
  .q-row .h-meter { margin-top: 6px; }
  .q-row .h-btn { min-height: 46px; padding: 8px 14px; font-size: 16px; }
  .q-row.done { background: #e9fff5; }
  .icon-btn.small { min-width: 56px; padding: 10px 12px; }
  [hidden] { display: none !important; }

  /* --- פרק ז: סיבוב מסך + מסכים קטנים --- */
  .rotate { display: none; }
  @media (orientation: portrait) {
    .hq { display: none; }
    .rotate { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; font-weight: 900; font-size: 26px; }
    .rotate .i { font-size: 80px; animation: rot 2s ease-in-out infinite; }
    @keyframes rot { 50% { transform: rotate(-90deg); } }
  }
  @media (max-height: 560px) {
    .logo { display: none; }
    .mission { min-height: 96px; }
    .mission.main { min-height: 110px; }
  }
</style>
</head>
<body>
  <!-- רקע: שמיים של לילה + קו רקיע של עיר -->
  <div class="hero-sky" id="sky"></div>
  <div class="h-skyline" aria-hidden="true">
    <svg viewBox="0 0 1200 240" preserveAspectRatio="none">
      <path fill="#12072e" d="M0 240V150h60v-40h40v60h50V90h70v80h40v-50h60v-60h30v-30h20v30h30v110h50v-70h80v90h40V70h60v100h50v-40h70v60h40v-90h60v-40h30v40h40v120h60v-60h70v80h50V100h60v140z"/>
      <g fill="#ffd95a" opacity=".55">
        <rect x="165" y="110" width="10" height="12"/><rect x="185" y="140" width="10" height="12"/><rect x="330" y="80" width="8" height="10"/>
        <rect x="560" y="100" width="10" height="12"/><rect x="580" y="130" width="10" height="12"/><rect x="820" y="90" width="8" height="10"/>
        <rect x="1080" y="120" width="10" height="12"/><rect x="1110" y="150" width="10" height="12"/><rect x="700" y="160" width="10" height="12"/>
      </g>
    </svg>
  </div>

  <main class="hq" id="hq">
    <!-- סרגל עליון: HUD (רמה/אנרגיה/מטבעות) + ארון + חנות + צליל -->
    <header class="topbar">
      <div id="hudSlot"></div>
      <div class="spacer"></div>
      <button type="button" class="h-btn gold icon-btn small gift-btn" id="giftBtn" aria-label="הפתעה יומית" hidden><span class="ico">🎁</span></button>
      <button type="button" class="h-btn violet icon-btn in-rail" id="wardrobeBtn"><span class="ico">🦸‍♀️</span><span>תחפושות</span></button>
      <button type="button" class="h-btn gold icon-btn in-rail" id="shopBtn"><span class="ico">🛒</span><span>שדרוגים</span></button>
      <button type="button" class="h-btn gold icon-btn small in-rail" id="albumBtn" aria-label="אלבום המדבקות"><span class="ico">📒</span><span id="albumCount">0</span></button>
      <button type="button" class="h-btn cyan icon-btn small" id="switchBtn" aria-label="החלפת ילדה" hidden><span class="ico">👭</span></button>
      <button type="button" class="h-btn violet icon-btn small" id="parentsBtn" aria-label="אזור הורים"><span class="ico">👨‍👩‍👧</span></button>
      <button type="button" class="h-btn cyan icon-btn small" id="soundBtn" aria-label="צליל"><span class="ico">🔊</span></button>
    </header>

    <section class="stage">
      <!-- סיידבר: קבוצות (ללמוד / הדרקון / לשחק / ליצור / הגיבורה שלי) — במרכז רק הכרטיסים של הקבוצה שנבחרה -->
      <nav class="rail" id="rail" role="tablist" aria-label="קבוצות"></nav>
      <!-- משימות (בצד ימין ב-RTL) -->
      <div>
        <div class="logo"><h1>העולם של <em>אלה</em></h1><p>גיבורת-העל שלומדת, יוצרת ומשחקת ⚡</p></div>
