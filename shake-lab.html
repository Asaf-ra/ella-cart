<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2a1260" />
<title>בר המילקשייק של אלה — ניסיון</title>
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
<link rel="stylesheet" href="shared/theme.css" />
<!-- 🧪 שלב 27 (ניסיון): בר המילקשייק — שדרוג המיני-משחק "גלידה" של העגלה, בדף נפרד.
     לא מקושר מהבית ולא נשמר ב-sw.js — הגרסה החיה של העגלה לא משתנה. המשחק כולו ב-js/shake-lab.js -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d0c46; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labBadge { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 86px; z-index: 50; pointer-events: none;
    padding: 6px 14px; border: 3px solid #1b1036; border-radius: 14px; background: #fff2a8; color: #1b1036;
    font: 900 15px/1 var(--h-font); box-shadow: 3px 4px 0 #1b1036; transform: rotate(-3deg); }
  #rotate { display: none; position: fixed; inset: 0; z-index: 9500; background: #1d0c46; color: #fff; text-align: center;
    font: 900 26px/1.5 var(--h-font); flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #rotate b { font-size: 72px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="בר המילקשייק — משחק"></canvas>
<div id="labBadge">🧪 גרסת ניסיון</div>
<div id="rotate"><b>🔄</b><div>סובבו את האייפד לרוחב 😊</div></div>

<script src="shared/profile.js"></script>
<script src="shared/kids-ui.js"></script>
<script src="js/audio.js"></script>
<script src="shared/wallet.js"></script>
<script src="js/shake-lab.js?v=1"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () { KidsUI.HomeButton.attach(); });
</script>
</body>
</html>
