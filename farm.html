<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1d0b4a" />
<meta name="apple-mobile-web-app-title" content="החווה של אלה" />
<title>החווה של אלה</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
<link rel="stylesheet" href="shared/theme.css" />
<link rel="stylesheet" href="shared/marvel-skin.css" />
<style>
  /* ===== החווה של אלה — עיצוב =====
     פרק א — בסיס וקנבס | פרק ב — HUD עליון, סל ומפת אזורים | פרק ג — לוח האזור (בזום)
     פרק ד — חלונות: משימות, שוק, אלבום, שם | פרק ה — אפקטים (הודעה, פלאש, מעוף לסל) | פרק ז — עור קומיקס גיבורים | פרק ו — סיבוב מסך */
  /* --- פרק א --- */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html { background: #6ec3ff; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: var(--h-font); color: var(--h-ink); touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #farmCv { position: fixed; inset: 0; display: block; }
  /* --- פרק ב --- */
  .top { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 14px; left: 90px; display: flex; gap: 8px; align-items: center; z-index: 10; pointer-events: none; }
  .top h1 { font: 900 clamp(22px, 3vw, 34px)/1 var(--h-font); color: #fff; -webkit-text-stroke: 4px var(--h-ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--h-magenta); margin-inline-end: auto; white-space: nowrap; }
  .chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 4px solid var(--h-ink); border-radius: 999px; background: var(--h-paper); color: var(--h-ink); font: 900 clamp(14px, 1.7vw, 19px)/1 var(--h-font); box-shadow: 0 4px 0 var(--h-ink); cursor: pointer; white-space: nowrap; }
  .chip.gold { background: linear-gradient(180deg, #fff3b0, #ffc93c); }
  #invBar { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 62px); right: 14px; display: flex; gap: 6px; z-index: 10; pointer-events: none; }
  #invBar span { padding: 4px 10px; border: 3px solid var(--h-ink); border-radius: 999px; background: rgba(255,255,255,.92); font: 900 16px/1.1 var(--h-font); }
  #zoneNav { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px 10px; border: 4px solid var(--h-ink); border-radius: 999px; background: rgba(255,250,240,.92); box-shadow: 0 5px 0 var(--h-ink); z-index: 10; transition: transform .4s var(--h-spring), opacity .3s; }
  .zn { width: clamp(42px, 5vw, 54px); height: clamp(42px, 5vw, 54px); border: 3px solid var(--h-ink); border-radius: 50%; background: #fff; font-size: clamp(20px, 2.6vw, 28px); cursor: pointer; box-shadow: 0 3px 0 var(--h-ink); }
  .zn:active { transform: translateY(3px) scale(.92); }
  body.zoomed #zoneNav { transform: translate(-50%, 140%); opacity: 0; }
  .hint { position: fixed; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 76px); left: 50%; transform: translateX(-50%); z-index: 9; padding: 6px 16px; border-radius: 999px; background: rgba(27,16,54,.72); color: #fff; font: 800 15px/1.2 var(--h-font); pointer-events: none; transition: opacity .4s; }
  body.zoomed .hint { opacity: 0; }
  /* --- פרק ג --- */
  #zonePanel { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 104px); right: 14px; width: clamp(200px, 22vw, 260px); max-height: calc(100vh - 130px); overflow-y: auto; z-index: 11; display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 5px solid var(--h-ink); border-radius: 26px; background: var(--h-paper); box-shadow: 0 6px 0 var(--h-ink); transform: translateX(130%); transition: transform .45s var(--h-spring); }
  body.zoomed #zonePanel { transform: none; }
  #zonePanel:empty { display: none; }
  #zonePanel h3 { font: 900 22px/1.1 var(--h-font); }
  #zonePanel p { font: 800 14px/1.35 var(--h-font); color: var(--h-text-soft); }
  #zonePanel .tiny { font-size: 12px; }
  #zonePanel .big { font: 900 26px/1 var(--h-font); text-align: center; padding: 6px; border-radius: 16px; background: #fff3dc; border: 3px solid var(--h-ink); }
  .zg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .zb { display: grid; place-items: center; gap: 2px; padding: 8px 6px; border: 3px solid var(--h-ink); border-radius: 16px; background: #fff; box-shadow: 0 3px 0 var(--h-ink); font: 800 14px/1.1 var(--h-font); color: var(--h-ink); cursor: pointer; }
  .zb b { font-size: 26px; line-height: 1; } .zb small { font-size: 12px; color: #b36b00; font-weight: 900; }
  .zb.wide { grid-column: 1 / -1; font-size: 16px; padding: 10px; }
  .zb.on, .zb#clapBtn.on { background: linear-gradient(180deg, #fff3b0, #ffc93c); }
  .zb.back { background: linear-gradient(180deg, #d9c2ff, #9b5cff); color: #fff; }
  .zb.name { background: #fff3dc; font-size: 16px; }
  .zb.sw { height: 50px; font-size: 24px; }
  .bar { height: 18px; border: 3px solid var(--h-ink); border-radius: 999px; background: #eee; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #fff, #9fe0ff); transition: width .2s; }
  /* --- פרק ד --- */
  .ov { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 16px; background: rgba(15,10,40,.62); }
  .ov.show { display: grid; }
  .card { width: min(94vw, 760px); max-height: 92vh; overflow: auto; padding: 18px 22px; }
  .card h2 { font: 900 clamp(24px, 3.2vw, 34px)/1.1 var(--h-font); margin-bottom: 10px; }
  .card h4 { font: 900 18px/1 var(--h-font); margin: 14px 0 8px; }
  .chore { display: grid; grid-template-columns: 1fr 120px 48px; gap: 10px; align-items: center; padding: 10px 12px; margin: 8px 0; border: 3px solid var(--h-ink); border-radius: 18px; background: #fff; font: 800 17px/1.2 var(--h-font); }
  .chore em { display: block; height: 14px; border: 3px solid var(--h-ink); border-radius: 999px; background: #eee; overflow: hidden; }
  .chore i { display: block; height: 100%; background: linear-gradient(90deg, #3ff2b0, #2fb85a); }
  .chore.done { background: linear-gradient(180deg, #e8fff4, #b6ffdc); }
  .streak { font: 900 18px/1 var(--h-font); color: #ff6a00; margin-top: 8px; }
  .mrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .mb { display: grid; justify-items: center; gap: 2px; min-width: 104px; padding: 8px; border: 3px solid var(--h-ink); border-radius: 16px; background: #fff; box-shadow: 0 3px 0 var(--h-ink); font: 800 14px/1.1 var(--h-font); color: var(--h-ink); cursor: pointer; }
  .mb b { font-size: 30px; } .mb small { color: #b36b00; font-weight: 900; } .mb.off { opacity: .5; } .mb.own { background: linear-gradient(180deg, #e8fff4, #b6ffdc); }
  .coins { font: 900 22px/1 var(--h-font); }
  .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  #albumGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .alb { border: 4px solid var(--h-ink); border-radius: 16px; overflow: hidden; background: #fff; cursor: pointer; padding: 0; }
  .alb img { width: 100%; display: block; }
  #nameInp { width: 100%; font: 900 28px var(--h-font); padding: 10px 14px; border: 4px solid var(--h-ink); border-radius: 18px; text-align: center; color: var(--h-ink); user-select: text; -webkit-user-select: text; margin: 10px 0; }
  /* --- פרק ה --- */
  .toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: 20%; z-index: 70;   /* מרכוז בלי transform — האנימציה h-card-in דורסת transform */ padding: 12px 22px; border: 4px solid var(--h-ink); border-radius: 999px; background: var(--h-paper); box-shadow: 0 5px 0 var(--h-ink); font: 900 clamp(17px, 2.2vw, 24px)/1 var(--h-font); pointer-events: none; animation: h-card-in .4s var(--h-spring) both; white-space: nowrap; }
  .flash { position: fixed; inset: 0; z-index: 80; background: #fff; pointer-events: none; animation: flash .5s ease-out forwards; }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }
  .flyto { position: fixed; z-index: 75; font-size: 56px; margin: -28px 0 0 -28px; transition: transform .8s cubic-bezier(.3,.7,.3,1), opacity .8s; pointer-events: none; }
  /* --- פרק ז — עור "קומיקס גיבורים" (מארוול): פאנלים מוטים, צל דיו קשיח, רסטר, בועות דיבור, תיבת קריינות ---
     כלל: כל רכיב מקבל מסגרת דיו 4px + צל היסט קשיח + מעט רסטר. אין backdrop-filter (כבד באייפד). */
  :root { --dots: radial-gradient(rgba(27,16,54,.13) 1.3px, transparent 1.7px); --dotsW: radial-gradient(rgba(255,255,255,.28) 1.3px, transparent 1.7px); }
  .top h1 { position: relative; font-size: clamp(24px, 3.3vw, 38px); letter-spacing: .5px; transform: rotate(-2deg); text-shadow: 3px 4px 0 var(--h-magenta), 6px 8px 0 var(--h-ink); }
  .top h1::after { content: "★ עולם הגיבורים ★"; position: absolute; left: 50%; bottom: -17px; transform: translateX(-50%) rotate(1.5deg); padding: 2px 10px; border: 3px solid var(--h-ink); background: var(--h-gold); color: var(--h-ink); -webkit-text-stroke: 0; text-shadow: none; font: 900 11px/1.2 var(--h-font); letter-spacing: 1px; white-space: nowrap; box-shadow: 3px 3px 0 var(--h-ink); }
  .chip { border-radius: 14px; transform: skewX(-7deg); background-color: var(--h-paper); background-image: var(--dots); background-size: 8px 8px; box-shadow: 4px 5px 0 var(--h-ink); transition: transform .15s var(--h-spring); }
  .chip:active { transform: skewX(-7deg) translate(3px, 4px); box-shadow: 1px 1px 0 var(--h-ink); }
  .chip.gold { background-image: var(--dotsW), linear-gradient(180deg, #fff3b0, #ffc93c); background-size: 8px 8px, auto; }
  #choresBtn { background-image: var(--dotsW), linear-gradient(180deg, #ffd0e8, #ff7ec2); background-size: 8px 8px, auto; }
  #invBar span { border-radius: 10px; transform: skewX(-7deg); background: #fff; background-image: var(--dots); background-size: 8px 8px; box-shadow: 3px 3px 0 var(--h-ink); }
  #zoneNav { border-radius: 20px; background: var(--h-ink); background-image: var(--dotsW); background-size: 9px 9px; border-color: var(--h-ink); box-shadow: 0 0 0 3px #fff, 6px 8px 0 3px var(--h-ink); padding: 7px 12px; }
  .zn { border-radius: 14px; border-color: #fff; background: linear-gradient(180deg, #fffaf0, #ffe7c2); box-shadow: 0 4px 0 #000; transition: transform .2s var(--h-spring), background .2s; }
  .zn.on { background: linear-gradient(180deg, #fff3b0, #ffc93c); transform: translateY(-6px) scale(1.12); box-shadow: 0 0 0 3px var(--h-magenta), 0 6px 0 #000; }
  .hint { border-radius: 4px; transform: translateX(-50%) skewX(-6deg); background: var(--h-gold); color: var(--h-ink); border: 3px solid var(--h-ink); box-shadow: 4px 4px 0 var(--h-ink); font-weight: 900; }
  #zonePanel { border-radius: 18px; transform: translateX(130%) rotate(1deg); background-color: var(--h-paper); background-image: var(--dots); background-size: 9px 9px; box-shadow: 8px 9px 0 var(--h-ink); padding-top: 0; overflow-x: hidden; }
  body.zoomed #zonePanel { transform: rotate(-1deg); }
  #zonePanel h3 { margin: 0 -12px 4px; padding: 12px 14px 10px; color: #fff; -webkit-text-stroke: 5px var(--h-ink); paint-order: stroke fill; font-size: 25px; letter-spacing: .3px;
    background: repeating-linear-gradient(-55deg, rgba(255,255,255,.14) 0 8px, transparent 8px 20px), linear-gradient(135deg, var(--h-magenta), #9b3dff); border-bottom: 4px solid var(--h-ink); }
  #zonePanel p { color: var(--h-ink); background: #fff; border: 3px solid var(--h-ink); border-radius: 4px 14px 14px 14px; padding: 7px 10px; box-shadow: 3px 3px 0 var(--h-ink); }
  .zb { border-radius: 12px; background-color: #fff; background-image: var(--dots); background-size: 8px 8px; box-shadow: 3px 4px 0 var(--h-ink); transition: transform .12s var(--h-spring); }
  .zb:active { transform: translate(3px, 4px); box-shadow: 0 0 0 var(--h-ink); }
  .zb.wide { background-image: var(--dotsW), linear-gradient(180deg, #7ef0ff, #29b6e0); color: #fff; -webkit-text-stroke: 3px var(--h-ink); paint-order: stroke fill; font-weight: 900; }
  .zb.back { background-image: var(--dotsW), linear-gradient(180deg, #c9a8ff, #7a3dff); }
  .zb.name { background-image: var(--dots), linear-gradient(180deg, #fff, #fff3dc); color: var(--h-ink); -webkit-text-stroke: 0; }
  .zb.on, .zb#clapBtn.on { background-image: var(--dotsW), linear-gradient(180deg, #fff3b0, #ffc93c); color: var(--h-ink); -webkit-text-stroke: 0; }
  .ov { background: radial-gradient(ellipse at 50% 35%, rgba(120,50,255,.55), rgba(10,4,32,.9) 70%); overflow: hidden; }
  .ov::before { content: ""; position: absolute; left: 50%; top: 45%; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax; background: repeating-conic-gradient(rgba(255,255,255,.07) 0 8deg, transparent 8deg 18deg); animation: rays 50s linear infinite; pointer-events: none; }
  @keyframes rays { to { transform: rotate(360deg); } }
  .ov .card { position: relative; border-radius: 20px; background-image: var(--dots); background-size: 9px 9px; box-shadow: 9px 10px 0 var(--h-ink), 0 30px 70px rgba(0,0,0,.45); animation: h-card-in .45s var(--h-spring) both; }
  .card h2 { display: inline-block; padding: 6px 16px; transform: rotate(-2deg); color: #fff; -webkit-text-stroke: 5px var(--h-ink); paint-order: stroke fill; background: linear-gradient(135deg, var(--h-magenta), #9b3dff); border: 4px solid var(--h-ink); box-shadow: 4px 5px 0 var(--h-ink); }
  .chore, .mb { border-radius: 12px; box-shadow: 4px 4px 0 var(--h-ink); }
  /* בועת דיבור במקום הודעה עגולה */
  .toast { border-radius: 26px; background-image: var(--dots); background-size: 8px 8px; box-shadow: 5px 6px 0 var(--h-ink); overflow: visible; }
  .toast::after { content: ""; position: absolute; bottom: -18px; right: 34px; border: 12px solid transparent; border-top: 16px solid var(--h-ink); }
  .toast::before { content: ""; position: absolute; bottom: -9px; right: 38px; z-index: 1; border: 8px solid transparent; border-top: 11px solid var(--h-paper); }
  /* תיבת קריינות "בינתיים..." */
  #capBox { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 70px); left: 96px; z-index: 12; padding: 8px 16px 9px; border: 4px solid var(--h-ink); background: var(--h-gold); background-image: var(--dotsW); background-size: 8px 8px; color: var(--h-ink); font: 900 clamp(20px, 2.6vw, 28px)/1.05 var(--h-font); box-shadow: 5px 6px 0 var(--h-ink); transform: translateX(calc(-100% - 140px)) rotate(-3deg); opacity: 0; transition: transform .5s var(--h-spring), opacity .25s; pointer-events: none; }
  #capBox small { display: block; font: 800 14px/1.2 var(--h-font); font-style: italic; opacity: .8; }
  #capBox.show { transform: translateX(0) rotate(-3deg); opacity: 1; }
  /* שכבת קומיקס קבועה מעל הקנבס: רסטר נקודות בשמיים ובקרקע + ויניטה. CSS = מורכב ב-GPU, בלי עלות לכל פריים */
  #comicFx { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, rgba(20,8,50,0) 55%, rgba(20,8,50,.26) 100%),
      radial-gradient(rgba(255,255,255,.2) 1.4px, transparent 1.9px) 0 0 / 12px 12px;
    -webkit-mask: linear-gradient(180deg, #000 0, rgba(0,0,0,.55) 60%, rgba(0,0,0,.9) 100%); mask: linear-gradient(180deg, #000 0, rgba(0,0,0,.55) 60%, rgba(0,0,0,.9) 100%); }
  #comicFx::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: radial-gradient(rgba(27,16,54,.16) 1.4px, transparent 1.9px) 0 0 / 11px 11px; }
  /* --- פרק ח — למידה (שלב 16): מדריך הטיפול וחידון החווה --- */
  .zb.learn { background-image: var(--dotsW), linear-gradient(180deg, #ffe7a0, #ffb13b); }
  .ghint { font: 800 15px/1.3 var(--h-font); color: var(--h-text-soft); margin: 4px 0 10px; }
  .gsteps { display: grid; gap: 10px; }
  .gstep { display: grid; grid-template-columns: 40px 56px 1fr auto; gap: 12px; align-items: center; text-align: right; padding: 10px 14px; border: 4px solid var(--h-ink); border-radius: 18px; background: #fff; background-image: var(--dots); background-size: 9px 9px; box-shadow: 4px 5px 0 var(--h-ink); cursor: pointer; font-family: var(--h-font); color: var(--h-ink); transition: transform .14s var(--h-spring); }
  .gstep:active { transform: translate(3px, 4px); box-shadow: 0 0 0 var(--h-ink); }
  .gstep.on { background-image: var(--dotsW), linear-gradient(180deg, #fff3b0, #ffc93c); }
  .gstep .gn { display: grid; place-items: center; width: 40px; height: 40px; border: 3px solid var(--h-ink); border-radius: 50%; background: var(--h-magenta); color: #fff; font: 900 20px/1 var(--h-font); box-shadow: 2px 3px 0 var(--h-ink); }
  .gstep .ge { font-size: 44px; line-height: 1; filter: drop-shadow(0 3px 0 rgba(16,30,54,.3)); }
  .gstep .gt b { display: block; font: 900 clamp(16px, 2vw, 20px)/1.2 var(--h-font); }
  .gstep .gt small { display: block; font: 700 clamp(13px, 1.5vw, 15px)/1.3 var(--h-font); color: var(--h-text-soft); margin-top: 3px; }
  .gstep .gw { padding: 4px 12px; border: 3px solid var(--h-ink); border-radius: 999px; background: var(--h-gold); font: 900 16px/1.2 var(--h-font); box-shadow: 2px 3px 0 var(--h-ink); }
  .qq { font: 900 clamp(20px, 2.8vw, 30px)/1.25 var(--h-font); margin: 8px 0 14px; padding: 12px 16px; border: 4px solid var(--h-ink); border-radius: 6px 20px 20px 20px; background: #fff; box-shadow: 4px 5px 0 var(--h-ink); }
  .qopts { display: grid; gap: 10px; }
  .qopt { padding: 14px 16px; border: 4px solid var(--h-ink); border-radius: 18px; background: #fff; background-image: var(--dots); background-size: 9px 9px; box-shadow: 4px 5px 0 var(--h-ink); font: 900 clamp(18px, 2.3vw, 24px)/1.2 var(--h-font); color: var(--h-ink); cursor: pointer; text-align: right; transition: transform .14s var(--h-spring), opacity .3s; }
  .qopt:active { transform: translate(3px, 4px); box-shadow: 0 0 0 var(--h-ink); }
  .qopt.ok { background-image: var(--dotsW), linear-gradient(180deg, #b6ffdc, #3ff2b0); }
  .qopt.no { background-image: var(--dotsW), linear-gradient(180deg, #ffd1c2, #ff9b7a); }
  .qopt.dim { opacity: .45; }
  .qwhy { display: none; margin-top: 12px; padding: 10px 14px; border: 4px solid var(--h-ink); border-radius: 16px; font: 800 clamp(15px, 1.9vw, 19px)/1.35 var(--h-font); animation: h-card-in .4s var(--h-spring) both; }
  .qwhy.show { display: block; } .qwhy.ok { background: #e8fff4; } .qwhy.no { background: #fff3dc; }
  /* --- פרק ט — 👥 חווה לשניים (שלב 18) --- */
  #duoBtn { background-image: var(--dotsW), linear-gradient(180deg, #c9f3ff, #ff9bc8); }
  #duoOv { position: fixed; inset: 0; z-index: 65; display: none; background: radial-gradient(ellipse at 50% 35%, rgba(120,50,255,.55), rgba(10,4,32,.9) 70%); }
  #duoOv.show { display: block; }
  #duoCv { position: absolute; inset: 0; display: none; touch-action: none; }
  #duoMenu { position: absolute; inset: 0; display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-content: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 12vw; }
  .duo-g { display: grid; justify-items: center; gap: 4px; padding: 16px 12px; border: 5px solid var(--h-ink); border-radius: 24px; background: var(--h-paper); background-image: var(--dots); background-size: 9px 9px; box-shadow: 8px 9px 0 var(--h-ink); color: var(--h-ink); font-family: var(--h-font); cursor: pointer; text-align: center; transition: transform .14s var(--h-spring); }
  .duo-g:active { transform: translate(4px, 5px); box-shadow: 2px 2px 0 var(--h-ink); }
  .duo-g b { font-size: clamp(44px, 7vw, 72px); line-height: 1; filter: drop-shadow(0 4px 0 rgba(16,30,54,.3)); }
  .duo-g span { font: 900 clamp(20px, 2.6vw, 28px)/1.1 var(--h-font); color: #fff; -webkit-text-stroke: 4px var(--h-ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--h-magenta); }
